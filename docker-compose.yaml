services:
  postgres_docker:
    image: "postgres:15"
    container_name: shieran_capstone1
    ports:
      - "5437:5432"
    networks: #bridge
      - taxi_network
    volumes:
      - ./pgdata:/var/lib/postgresql/data
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: always

  ubuntu-services:
    build:
      context: .
      dockerfile: dockerfile.ubuntu
    container_name: shieran_capstone1_ubuntu
    tty: true
    stdin_open: true
    volumes:
      - .:/workspace #set local directory as mount
    depends_on:
      postgres_docker:
        condition: service_healthy
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
      DB_HOST: postgres_docker
      DB_PORT: 5432

      #SMTP
      SMTP_USER: ${SMTP_USER}
      SMTP_PASSWORD: ${SMTP_PASSWORD}
      EMAIL_TO: ${EMAIL_TO}

      #DISCORD WEBHOOK URL
      DISCORD_WEBHOOK_URL_PERSONAL: ${DISCORD_WEBHOOK_URL_PERSONAL}
      DISCORD_WEBHOOK_URL_CAPSTONE: ${DISCORD_WEBHOOK_URL_CAPSTONE}
      

    networks:
     - taxi_network
    restart: always
networks:
  taxi_network:
    driver: bridge